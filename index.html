 <head>

 <body class="h-full bg-gray-50">
  <div id="app" class="w-full h-full"></div>
  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzh5Lvhn8aT-k6vAWm1Fm7WTpd2qju50t74CMy038vcx3rEMsm7EKtCYwYZhi2wTSjY/exec';
    
    const defaultConfig = {
      app_title: "ARSIP SURAT",
      school_name: "SD NEGERI 15 LUBUK BESAR",
      login_title: "Selamat Datang",
      login_subtitle: "Silakan masuk untuk melanjutkan",
      primary_color: "#667eea",
      secondary_color: "#3b82f6",
      accent_color: "#10b981",
      text_color: "#1f2937",
      background_color: "#f9fafb"
    };

    let allRecords = [];
    let currentUser = null;
    let currentView = 'login';
    let editingId = null;
    let selectedDashboardYear = new Date().getFullYear();
    
    const CREDENTIALS = {
      username: 'administrator',
      password: '15lbsdnbisa!'
    };

    const SESSION_DURATION = 10 * 60 * 1000; // 10 menit dalam milidetik

    function saveSession() {
      const sessionData = {
        user: currentUser,
        timestamp: Date.now()
      };
      localStorage.setItem('userSession', JSON.stringify(sessionData));
    }

    function checkSession() {
      const sessionData = localStorage.getItem('userSession');
      if (!sessionData) return false;

      try {
        const session = JSON.parse(sessionData);
        const now = Date.now();
        const sessionAge = now - session.timestamp;

        if (sessionAge < SESSION_DURATION) {
          currentUser = session.user;
          return true;
        } else {
          localStorage.removeItem('userSession');
          return false;
        }
      } catch (error) {
        localStorage.removeItem('userSession');
        return false;
      }
    }

    function clearSession() {
      localStorage.removeItem('userSession');
    }

    async function getAllData() {
      try {
        const response = await fetch(`${APPS_SCRIPT_URL}?action=getAllData`);
        const result = await response.json();
        return result.success ? (result.data || []) : [];
      } catch (error) {
        console.error('Error:', error);
        showToast('Gagal memuat data dari server', 'error');
        return [];
      }
    }

    async function createSurat(suratData) {
      try {
        const formData = new URLSearchParams();
        formData.append('action', 'createSurat');
        formData.append('data', JSON.stringify(suratData));
        
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: formData
        });
        
        return await response.json();
      } catch (error) {
        console.error('Error creating surat:', error);
        return { success: false, message: error.toString() };
      }
    }

    async function updateSurat(suratData) {
      try {
        const formData = new URLSearchParams();
        formData.append('action', 'updateSurat');
        formData.append('data', JSON.stringify(suratData));
        
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: formData
        });
        
        return await response.json();
      } catch (error) {
        console.error('Error updating surat:', error);
        return { success: false, message: error.toString() };
      }
    }

    async function deleteSurat(id, type) {
      try {
        const formData = new URLSearchParams();
        formData.append('action', 'deleteSurat');
        formData.append('id', id);
        formData.append('type', type);
        
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: formData
        });
        
        return await response.json();
      } catch (error) {
        console.error('Error deleting surat:', error);
        return { success: false, message: error.toString() };
      }
    }

    async function uploadFile(file) {
      try {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          
          reader.onload = async function(e) {
            try {
              const base64Data = e.target.result.split(',')[1];
              
              const formData = new URLSearchParams();
              formData.append('action', 'uploadFile');
              formData.append('fileData', base64Data);
              formData.append('fileName', file.name);
              formData.append('mimeType', file.type);
              
              const response = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                body: formData
              });
              
              const result = await response.json();
              resolve(result);
            } catch (error) {
              reject(error);
            }
          };
          
          reader.onerror = function(error) {
            reject(error);
          };
          
          reader.readAsDataURL(file);
        });
      } catch (error) {
        console.error('Error uploading file:', error);
        return { success: false, message: error.toString() };
      }
    }

    async function initializeApp() {
      if (window.elementSdk) {
        window.elementSdk.init({
          defaultConfig,
          onConfigChange: async (config) => {
            if (currentUser && currentView !== 'login') {
              renderCurrentView();
            } else if (currentView === 'login') {
              renderLogin();
            }
          },
          mapToCapabilities: (config) => ({
            recolorables: [
              {
                get: () => config.background_color || defaultConfig.background_color,
                set: (value) => {
                  config.background_color = value;
                  window.elementSdk.setConfig({ background_color: value });
                }
              },
              {
                get: () => config.text_color || defaultConfig.text_color,
                set: (value) => {
                  config.text_color = value;
                  window.elementSdk.setConfig({ text_color: value });
                }
              },
              {
                get: () => config.primary_color || defaultConfig.primary_color,
                set: (value) => {
                  config.primary_color = value;
                  window.elementSdk.setConfig({ primary_color: value });
                }
              },
              {
                get: () => config.secondary_color || defaultConfig.secondary_color,
                set: (value) => {
                  config.secondary_color = value;
                  window.elementSdk.setConfig({ secondary_color: value });
                }
              },
              {
                get: () => config.accent_color || defaultConfig.accent_color,
                set: (value) => {
                  config.accent_color = value;
                  window.elementSdk.setConfig({ accent_color: value });
                }
              }
            ],
            borderables: [],
            fontEditable: undefined,
            fontSizeable: undefined
          }),
          mapToEditPanelValues: (config) => new Map([
            ["app_title", config.app_title || defaultConfig.app_title],
            ["school_name", config.school_name || defaultConfig.school_name],
            ["login_title", config.login_title || defaultConfig.login_title],
            ["login_subtitle", config.login_subtitle || defaultConfig.login_subtitle]
          ])
        });
      }
      
      // Cek apakah ada sesi aktif
      if (checkSession()) {
        showLoadingOverlay('Memuat data dari server...');
        await loadData();
        hideLoadingOverlay();
        currentView = 'dashboard';
        renderDashboard();
        startRealtimeClock();
      } else {
        renderLogin();
      }
    }

    function getConfig() {
      if (window.elementSdk && window.elementSdk.config) {
        return window.elementSdk.config;
      }
      return defaultConfig;
    }

    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      const bgColor = type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#3b82f6';
      
      toast.className = 'fixed top-20 right-4 px-4 sm:px-6 py-3 rounded-lg shadow-lg text-white z-40 scale-in text-sm sm:text-base max-w-xs sm:max-w-md';
      toast.style.backgroundColor = bgColor;
      toast.innerHTML = `
        <div class="flex items-center gap-2 sm:gap-3">
          <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
          <span>${message}</span>
        </div>
      `;
      
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-20px)';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    async function loadData() {
      allRecords = await getAllData();
    }

    function showLoadingOverlay(message = 'Memuat...') {
      const overlay = document.createElement('div');
      overlay.id = 'loadingOverlay';
      overlay.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4';
      overlay.innerHTML = `
        <div class="bg-white rounded-xl shadow-2xl p-6 sm:p-8 text-center max-w-sm w-full">
          <div class="spinner mx-auto mb-4"></div>
          <p class="text-gray-700 font-medium text-sm sm:text-base">${message}</p>
        </div>
      `;
      document.body.appendChild(overlay);
    }

    function hideLoadingOverlay() {
      const overlay = document.getElementById('loadingOverlay');
      if (overlay) {
        overlay.remove();
      }
    }

    function renderLogin() {
      const config = getConfig();
      const app = document.getElementById('app');
      app.style.backgroundColor = config.background_color || defaultConfig.background_color;
      
      app.innerHTML = `
        <div class="w-full h-full flex items-center justify-center p-4" style="background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #f5f3ff 100%); position: relative; overflow: hidden;">
          <div style="position: absolute; width: 200px; height: 200px; background: rgba(147, 197, 253, 0.2); border-radius: 50%; top: -50px; right: -50px; backdrop-filter: blur(60px);"></div>
          <div style="position: absolute; width: 250px; height: 250px; background: rgba(196, 181, 253, 0.2); border-radius: 50%; bottom: -75px; left: -75px; backdrop-filter: blur(60px);"></div>
          <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 w-full max-w-md scale-in" style="position: relative; z-index: 10;">
            <div class="text-center mb-6 sm:mb-8">
              <div class="w-20 h-20 sm:w-24 sm:h-24 mx-auto mb-4">
                <img src="https://iili.io/fWocYge.png" alt="Logo Sekolah" class="w-full h-full object-contain" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'w-20 h-20 sm:w-24 sm:h-24 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center shadow-lg\'><i class=\'fas fa-envelope-open-text text-white text-3xl sm:text-4xl\'></i></div>';">
              </div>
              <h1 class="text-2xl sm:text-3xl font-bold mb-2" style="color: ${config.text_color || defaultConfig.text_color};">ARSIP SURAT</h1>
              <h2 class="text-base sm:text-lg font-semibold text-gray-700 mb-4">${config.school_name || defaultConfig.school_name}</h2>
              <p class="text-sm sm:text-base text-gray-600 mt-4">${config.login_title || defaultConfig.login_title}</p>
              <p class="text-xs sm:text-sm text-gray-500">${config.login_subtitle || defaultConfig.login_subtitle}</p>
            </div>
            
            <form id="loginForm" class="space-y-4 sm:space-y-6">
              <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                  <i class="fas fa-user mr-2"></i>Nama Pengguna
                </label>
                <input type="text" id="username" class="w-full px-3 sm:px-4 py-2 sm:py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition text-sm sm:text-base" placeholder="Masukkan nama pengguna" required>
              </div>
              
              <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                  <i class="fas fa-lock mr-2"></i>Kata Sandi
                </label>
                <div class="relative">
                  <input type="password" id="password" class="w-full px-3 sm:px-4 py-2 sm:py-3 pr-10 sm:pr-12 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition text-sm sm:text-base" placeholder="Masukkan kata sandi" required>
                  <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700 transition">
                    <i id="passwordIcon" class="fas fa-eye"></i>
                  </button>
                </div>
              </div>
              
              <div id="loginError" class="hidden text-red-600 text-xs sm:text-sm text-center bg-red-50 py-2 rounded-lg"></div>
              
              <button type="submit" class="w-full py-2 sm:py-3 rounded-lg text-white font-semibold btn-hover shadow-lg text-sm sm:text-base" style="background: linear-gradient(135deg, ${config.primary_color || defaultConfig.primary_color} 0%, ${config.secondary_color || defaultConfig.secondary_color} 100%);">
                <i class="fas fa-sign-in-alt mr-2"></i>Masuk
              </button>
            </form>
            
            <div class="text-center mt-4 sm:mt-6 pt-4 sm:pt-6 border-t border-gray-200">
              <p class="text-xs sm:text-sm text-gray-600">
                Copyright © ${new Date().getFullYear()} Aldi Pratama
              </p>
            </div>
          </div>
        </div>
      `;
      
      document.getElementById('loginForm').addEventListener('submit', handleLogin);
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');
      
      if (username === CREDENTIALS.username && password === CREDENTIALS.password) {
        currentUser = { username: username };
        saveSession(); // Simpan sesi login
        
        showLoadingOverlay('Memuat data dari server...');
        await loadData();
        hideLoadingOverlay();
        
        currentView = 'dashboard';
        renderDashboard();
        startRealtimeClock();
      } else {
        errorDiv.textContent = 'Nama pengguna atau kata sandi salah!';
        errorDiv.classList.remove('hidden');
      }
    }

    function renderDashboard() {
      const config = getConfig();
      const app = document.getElementById('app');
      app.style.backgroundColor = config.background_color || defaultConfig.background_color;
      
      const currentYear = new Date().getFullYear();
      const dataYears = [...new Set(allRecords.map(r => new Date(r.tanggal_surat).getFullYear()))].filter(y => !isNaN(y));
      const availableYears = [...new Set([currentYear, ...dataYears])].sort((a, b) => b - a);
      
      if (!selectedDashboardYear || !availableYears.includes(selectedDashboardYear)) {
        selectedDashboardYear = currentYear;
      }
      
      const filteredRecords = allRecords.filter(r => {
        const year = new Date(r.tanggal_surat).getFullYear();
        return year === selectedDashboardYear;
      });
      const suratMasuk = filteredRecords.filter(r => r.type === 'masuk').length;
      const suratKeluar = filteredRecords.filter(r => r.type === 'keluar').length;
      const totalSurat = filteredRecords.length;
      
      app.innerHTML = `

          ${renderNavbar()}

                        <option value="${year}" ${year === selectedDashboardYear ? 'selected' : ''}>${year}</option>
                      `).join('')}
                    </select>
                  </div>
                </div>
                <p class="text-sm sm:text-base text-gray-600">Ringkasan data surat tahun ${selectedDashboardYear}</p>
              </div>
              
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6 mb-6 sm:mb-8">
                <div class="bg-white rounded-xl shadow-lg p-4 sm:p-6 card-hover border-t-4" style="border-color: ${config.primary_color || defaultConfig.primary_color};">
                  <div class="flex items-center justify-between mb-3 sm:mb-4">
                    <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full flex items-center justify-center flex-shrink-0" style="background: linear-gradient(135deg, ${config.primary_color || defaultConfig.primary_color}, ${config.secondary_color || defaultConfig.secondary_color});">
                      <i class="fas fa-inbox text-white text-xl sm:text-2xl"></i>
                    </div>
                    <div class="text-right">
                      <p class="text-xs sm:text-sm text-gray-600 font-medium">Surat Masuk</p>
                      <h3 class="text-3xl sm:text-4xl font-bold" style="color: ${config.text_color || defaultConfig.text_color};">${suratMasuk}</h3>
                    </div>
                  </div>
                  <div class="pt-3 sm:pt-4 border-t border-gray-100">
                    <p class="text-xs text-gray-500"><i class="fas fa-calendar mr-2"></i>Tahun ${selectedDashboardYear}</p>
                  </div>
                </div>
                
                <div class="bg-white rounded-xl shadow-lg p-4 sm:p-6 card-hover border-t-4" style="border-color: ${config.accent_color || defaultConfig.accent_color};">
                  <div class="flex items-center justify-between mb-3 sm:mb-4">
                    <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full flex items-center justify-center flex-shrink-0" style="background: ${config.accent_color || defaultConfig.accent_color};">
                      <i class="fas fa-paper-plane text-white text-xl sm:text-2xl"></i>
                    </div>
                    <div class="text-right">
                      <p class="text-xs sm:text-sm text-gray-600 font-medium">Surat Keluar</p>
                      <h3 class="text-3xl sm:text-4xl font-bold" style="color: ${config.text_color || defaultConfig.text_color};">${suratKeluar}</h3>

                  </div>
                  <div class="pt-3 sm:pt-4 border-t border-gray-100">
                    <p class="text-xs text-gray-500"><i class="fas fa-calendar mr-2"></i>Tahun ${selectedDashboardYear}</p>
                  </div>
                </div>
                
                <div class="bg-white rounded-xl shadow-lg p-4 sm:p-6 card-hover border-t-4 border-purple-500 sm:col-span-2 lg:col-span-1">
                  <div class="flex items-center justify-between mb-3 sm:mb-4">

                      <option value="0">Januari</option>
                      <option value="1">Februari</option>
                      <option value="2">Maret</option>

    function filterSuratMasuk(searchTerm) {
      const term = searchTerm.toLowerCase().trim();
      let suratMasuk = allRecords.filter(r => r.type === 'masuk');
      
      if (selectedSuratMasukYear !== 'all') {
        suratMasuk = suratMasuk.filter(r => new Date(r.tanggal_surat).getFullYear() === parseInt(selectedSuratMasukYear));
      }
      
      let filtered = suratMasuk;
      
      if (term) {
        filtered = suratMasuk.filter(surat => {
          return (
            surat.nomor_surat.toLowerCase().includes(term) ||
            surat.isi_ringkas.toLowerCase().includes(term) ||
            surat.dari.toLowerCase().includes(term) ||
            surat.kepada.toLowerCase().includes(term) ||
            surat.pengelola.toLowerCase().includes(term)
          );
        });
      }
      
      filtered.sort((a, b) => new Date(a.tanggal_terima) - new Date(b.tanggal_terima));
      
      const container = document.getElementById('suratMasukContainer');
      if (container) {
        container.innerHTML = renderSuratMasukTable(filtered);
      }

    async function handleSuratSubmit(e, type) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Menyimpan...';
      
      const fileInput = document.getElementById('fileSurat');
      let fileName = null;
      let fileType = null;
      let fileUrl = null;
      
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        showToast('Mengupload file...', 'info');
        
        const uploadResult = await uploadFile(file);
        
        if (uploadResult.success) {
          fileName = uploadResult.data.fileName;
          fileType = file.name.endsWith('.pdf') ? 'pdf' : 'word';
          fileUrl = uploadResult.data.fileUrl;
          showToast('File berhasil diupload!', 'success');
        } else {
          const messageDiv = document.getElementById('formMessage');
          messageDiv.textContent = 'Gagal upload file: ' + uploadResult.message;
          messageDiv.className = 'text-sm p-3 rounded-lg bg-red-50 text-red-600';
          messageDiv.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fas fa-save mr-2"></i>Simpan';
          return;
        }
      }
      
      const suratData = {
        id: editingId || 'surat_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
        type: type,
        nomor_urut: parseInt(document.getElementById('nomorUrut').value),
        tanggal_terima: document.getElementById('tanggalTerima').value,
        nomor_surat: document.getElementById('nomorSurat').value,
        tanggal_surat: document.getElementById('tanggalSurat').value,
        sifat: document.getElementById('sifatSurat').value,
        isi_ringkas: document.getElementById('isiRingkas').value,
        dari: document.getElementById('dari').value,
        kepada: document.getElementById('kepada').value,
        pengelola: type === 'masuk' ? document.getElementById('pengelola').value : '',
        keterangan: type === 'keluar' ? (document.getElementById('keterangan') ? document.getElementById('keterangan').value : '') : '',
        file_name: fileName,
        file_type: fileType,
        file_url: fileUrl,
        created_at: new Date().toISOString()
      };
      
      let result;
      if (editingId) {
        result = await updateSurat(suratData);
      } else {
        result = await createSurat(suratData);
      }
      
      if (result.success) {
        showToast('Data berhasil disimpan!', 'success');
        await loadData();
        navigateTo(`surat-${type}`);
      } else {
        const messageDiv = document.getElementById('formMessage');
        messageDiv.textContent = 'Gagal menyimpan data: ' + result.message;
        messageDiv.className = 'text-sm p-3 rounded-lg bg-red-50 text-red-600';
        messageDiv.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-save mr-2"></i>Simpan';
      }
    }

      deleteBtn.disabled = true;
      deleteBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Menghapus...';

      if (result.success) {

    function formatDate(dateString) {
      if (!dateString) return '-';
      const date = new Date(dateString);
      return date.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function navigateTo(view) {

    function renderCurrentView() {
      switch(currentView) {
        case 'dashboard':
          renderDashboard();
          break;
        case 'surat-masuk':
          renderSuratMasuk();
          break;
        case 'surat-keluar':
          renderSuratKeluar();
          break;
      }
      
      startRealtimeClock();

    function startRealtimeClock() {
      if (window.clockInterval) {
        clearInterval(window.clockInterval);
      }
      
      updateClock();
      window.clockInterval = setInterval(updateClock, 1000);
    }
    
    function updateClock() {
      const dateTimeElement = document.getElementById('realtimeDateTime');
      if (!dateTimeElement) return;
      
      const now = new Date();
      const days = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];
      
      const dayName = days[now.getDay()];
      const date = now.getDate();
      const month = months[now.getMonth()];
      const year = now.getFullYear();
      
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      dateTimeElement.textContent = `${dayName}, ${date} ${month} ${year} | ${hours}:${minutes}:${seconds}`;
    }

    function logout() {
      currentUser = null;
      currentView = 'login';
      allRecords = [];
      clearSession(); // Hapus sesi login
      
      if (window.clockInterval) {
        clearInterval(window.clockInterval);
      }
      
      renderLogin();
    }

    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const passwordIcon = document.getElementById('passwordIcon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';

      } else {

      }
    }

    function changeDashboardYear(year) {
      selectedDashboardYear = parseInt(year);
      renderDashboard();
      startRealtimeClock();
    }

    function calculatePeriod() {
      const startMonth = parseInt(document.getElementById('startMonth').value);
      const endMonth = parseInt(document.getElementById('endMonth').value);
      const year = selectedDashboardYear;
      
      const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      
      if (startMonth > endMonth) {
        document.getElementById('periodInfo').innerHTML = '<i class="fas fa-exclamation-triangle mr-2"></i>Bulan awal tidak boleh lebih besar dari bulan akhir!';
        document.getElementById('periodInfo').className = 'mt-4 p-3 sm:p-4 bg-red-50 border border-red-200 rounded-lg text-xs sm:text-sm text-red-800';
        return;
      }
      
      const filtered = allRecords.filter(record => {
        const recordDate = new Date(record.tanggal_surat);
        const recordYear = recordDate.getFullYear();
        const recordMonth = recordDate.getMonth();
        
        return recordYear === year && recordMonth >= startMonth && recordMonth <= endMonth;
      });
      
      const masukCount = filtered.filter(r => r.type === 'masuk').length;
      const keluarCount = filtered.filter(r => r.type === 'keluar').length;
      const totalCount = filtered.length;
      
      document.getElementById('periodMasuk').textContent = masukCount;
      document.getElementById('periodKeluar').textContent = keluarCount;
      document.getElementById('periodTotal').textContent = totalCount;
      
      const periodText = startMonth === endMonth 
        ? `${monthNames[startMonth]} ${year}`
        : `${monthNames[startMonth]} - ${monthNames[endMonth]} ${year}`;
      
      document.getElementById('periodInfo').innerHTML = `<i class="fas fa-check-circle mr-2"></i>Menampilkan data untuk periode ${periodText}: ${totalCount} surat`;
      document.getElementById('periodInfo').className = 'mt-4 p-3 sm:p-4 bg-blue-50 border border-blue-200 rounded-lg text-xs sm:text-sm text-blue-800';
    }

    window.navigateTo = navigateTo;

    window.filterSuratMasuk = filterSuratMasuk;

    window.changeDashboardYear = changeDashboardYear;
    window.changeSuratMasukYear = changeSuratMasukYear;
    window.changeSuratKeluarYear = changeSuratKeluarYear;
    window.calculatePeriod = calculatePeriod;
    window.printRekapanSuratMasuk = printRekapanSuratMasuk;
    window.printRekapanSuratKeluar = printRekapanSuratKeluar;

    initializeApp();
