 <body class="h-full bg-gray-50">
  <div id="app" class="w-full h-full"></div>
  <script>
    // URL Google Apps Script
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzh5Lvhn8aT-k6vAWm1Fm7WTpd2qju50t74CMy038vcx3rEMsm7EKtCYwYZhi2wTSjY/exec';
    
    const defaultConfig = {
      app_title: "Agenda Surat SD Negeri 15 Lubuk Besar",
      school_name: "SD NEGERI 15 LUBUK BESAR",
      login_title: "Selamat Datang",
      login_subtitle: "Silakan masuk untuk melanjutkan",
      primary_color: "#667eea",
      secondary_color: "#3b82f6",
      accent_color: "#10b981",
      text_color: "#1f2937",
      background_color: "#f8f9fa",
      navbar_color: "#ffffff",
      tab_color: "#3b82f6"
    };

    let allRecords = [];
    let currentUser = null;
    let currentView = 'dashboard';
    let editingId = null;
    let chartPeriod = 'monthly';
    let isLoading = false;
    
    const CREDENTIALS = {
      username: 'administrator',
      password: '15lbsdnbisa!'
    };

    // ====================================
    // API FUNCTIONS - GOOGLE APPS SCRIPT
    // ====================================

    async function getAllData() {
      try {
        const response = await fetch(`${APPS_SCRIPT_URL}?action=getAllData`);
        const result = await response.json();
        
        if (result.success) {
          return result.data || [];
        } else {
          console.error('Error fetching data:', result.message);
          return [];
        }
      } catch (error) {
        console.error('Error:', error);
        showToast('Gagal memuat data dari server', 'error');
        return [];
      }
    }

    async function createSurat(suratData) {
      try {
        const formData = new URLSearchParams();
        formData.append('action', 'createSurat');
        formData.append('data', JSON.stringify(suratData));
        
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: formData
        });
        
        const result = await response.json();
        return result;
      } catch (error) {
        console.error('Error creating surat:', error);
        return { success: false, message: error.toString() };
      }
    }

    async function updateSurat(suratData) {
      try {
        const formData = new URLSearchParams();
        formData.append('action', 'updateSurat');
        formData.append('data', JSON.stringify(suratData));
        
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: formData
        });
        
        const result = await response.json();
        return result;
      } catch (error) {
        console.error('Error updating surat:', error);
        return { success: false, message: error.toString() };
      }
    }

    async function deleteSurat(id, type) {
      try {
        const formData = new URLSearchParams();
        formData.append('action', 'deleteSurat');
        formData.append('id', id);
        formData.append('type', type);
        
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: formData
        });
        
        const result = await response.json();
        return result;
      } catch (error) {
        console.error('Error deleting surat:', error);
        return { success: false, message: error.toString() };
      }
    }

    async function uploadFile(file) {
      try {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          
          reader.onload = async function(e) {
            try {
              const base64Data = e.target.result.split(',')[1];
              
              const formData = new URLSearchParams();
              formData.append('action', 'uploadFile');
              formData.append('fileData', base64Data);
              formData.append('fileName', file.name);
              formData.append('mimeType', file.type);
              
              const response = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                body: formData
              });
              
              const result = await response.json();
              resolve(result);
            } catch (error) {
              reject(error);
            }
          };
          
          reader.onerror = function(error) {
            reject(error);
          };
          
          reader.readAsDataURL(file);
        });
      } catch (error) {
        console.error('Error uploading file:', error);
        return { success: false, message: error.toString() };
      }
    }

    // ====================================
    // INITIALIZATION
    // ====================================

    async function initializeApp() {
      if (window.elementSdk) {
        window.elementSdk.init({
          defaultConfig,
          onConfigChange: async (config) => {
            if (currentUser && currentView !== 'login') {
              renderCurrentView();
            } else if (currentView === 'login') {
              renderLogin();
            }
          },
          mapToCapabilities: (config) => ({
            recolorables: [
              {
                get: () => config.background_color || defaultConfig.background_color,
                set: (value) => {
                  config.background_color = value;
                  window.elementSdk.setConfig({ background_color: value });
                }
              },
              {
                get: () => config.navbar_color || defaultConfig.navbar_color,
                set: (value) => {
                  config.navbar_color = value;
                  window.elementSdk.setConfig({ navbar_color: value });
                }
              },
              {
                get: () => config.text_color || defaultConfig.text_color,
                set: (value) => {
                  config.text_color = value;
                  window.elementSdk.setConfig({ text_color: value });
                }
              },
              {
                get: () => config.primary_color || defaultConfig.primary_color,
                set: (value) => {
                  config.primary_color = value;
                  window.elementSdk.setConfig({ primary_color: value });
                }
              },
              {
                get: () => config.accent_color || defaultConfig.accent_color,
                set: (value) => {
                  config.accent_color = value;
                  window.elementSdk.setConfig({ accent_color: value });
                }
              },
              {
                get: () => config.tab_color || defaultConfig.tab_color,
                set: (value) => {
                  config.tab_color = value;
                  window.elementSdk.setConfig({ tab_color: value });
                }
              }
            ],
            borderables: [],
            fontEditable: undefined,
            fontSizeable: undefined
          }),
          mapToEditPanelValues: (config) => new Map([
            ["app_title", config.app_title || defaultConfig.app_title],
            ["school_name", config.school_name || defaultConfig.school_name],
            ["login_title", config.login_title || defaultConfig.login_title],
            ["login_subtitle", config.login_subtitle || defaultConfig.login_subtitle]
          ])
        });
      }
      
      renderLogin();
    }

    function getConfig() {
      if (window.elementSdk && window.elementSdk.config) {
        return window.elementSdk.config;
      }
      return defaultConfig;
    }

    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      const bgColor = type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#3b82f6';
      
      toast.className = 'fixed top-4 right-4 px-6 py-3 rounded-lg shadow-lg text-white z-50 scale-in';
      toast.style.backgroundColor = bgColor;
      toast.innerHTML = `
        <div class="flex items-center gap-3">
          <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
          <span>${message}</span>
        </div>
      `;
      
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-20px)';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    async function loadData() {
      isLoading = true;
      allRecords = await getAllData();
      isLoading = false;
    }

    function renderLogin() {

      app.innerHTML = `

          <div style="position: absolute; width: 300px; height: 300px; background: rgba(147, 197, 253, 0.2); border-radius: 50%; top: -100px; right: -100px; backdrop-filter: blur(60px);"></div>
          <div style="position: absolute; width: 400px; height: 400px; background: rgba(196, 181, 253, 0.2); border-radius: 50%; bottom: -150px; left: -150px; backdrop-filter: blur(60px);"></div>
          <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md scale-in" style="position: relative; z-index: 10;">
            <div class="text-center mb-8">
              <img src="https://iili.io/fWocYge.png" alt="Logo SD" class="w-24 h-24 mx-auto mb-4 pulse-logo" onerror="this.style.display='none';">
              <h1 class="text-3xl font-bold mb-2" style="color: ${config.text_color || defaultConfig.text_color};">${config.app_title || defaultConfig.app_title}</h1>
              <p class="text-gray-600 mt-4">${config.login_title || defaultConfig.login_title}</p>
              <p class="text-sm text-gray-500">${config.login_subtitle || defaultConfig.login_subtitle}</p>
            </div>
            
            <form id="loginForm" class="space-y-6">
              <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                  <i class="fas fa-user mr-2"></i>Nama Pengguna
                </label>
                <input type="text" id="username" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" placeholder="Masukkan nama pengguna" required>
              </div>
              
              <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                  <i class="fas fa-lock mr-2"></i>Kata Sandi
                </label>
                <input type="password" id="password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" placeholder="Masukkan kata sandi" required>
              </div>
              
              <div id="loginError" class="hidden text-red-600 text-sm text-center bg-red-50 py-2 rounded-lg"></div>
              
              <button type="submit" class="w-full py-3 rounded-lg text-white font-semibold btn-hover shadow-lg" style="background: linear-gradient(135deg, ${config.primary_color || defaultConfig.primary_color} 0%, ${config.secondary_color || defaultConfig.secondary_color} 100%);">
                <i class="fas fa-sign-in-alt mr-2"></i>Masuk
              </button>

      `;
      
      document.getElementById('loginForm').addEventListener('submit', handleLogin);
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');
      
      if (username === CREDENTIALS.username && password === CREDENTIALS.password) {
        currentUser = {
          username: username,
          profileImage: null,
          password: CREDENTIALS.password
        };
        
        // Load data from Google Sheets
        showLoadingOverlay('Memuat data dari server...');
        await loadData();
        hideLoadingOverlay();
        
        currentView = 'dashboard';
        renderDashboard();
      } else {
        errorDiv.textContent = 'Nama pengguna atau kata sandi salah!';
        errorDiv.classList.remove('hidden');
      }
    }

    function showLoadingOverlay(message = 'Memuat...') {
      const overlay = document.createElement('div');
      overlay.id = 'loadingOverlay';
      overlay.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
      overlay.innerHTML = `
        <div class="bg-white rounded-xl shadow-2xl p-8 text-center">
          <div class="spinner mx-auto mb-4"></div>
          <p class="text-gray-700 font-medium">${message}</p>
        </div>
      `;
      document.body.appendChild(overlay);
    }

    function hideLoadingOverlay() {
      const overlay = document.getElementById('loadingOverlay');
      if (overlay) {
        overlay.remove();
      }
    }

      const suratKeluar = allRecords.filter(r => r.type === 'keluar');

      app.innerHTML = `
        <div class="w-full h-full flex flex-col">
          ${renderNavbar()}
          
          <div class="flex-1 overflow-auto p-6">
            <div class="max-w-7xl mx-auto">
              <div class="mb-6 slide-down">
                <h1 class="text-3xl font-bold mb-2" style="color: ${config.text_color || defaultConfig.text_color};">Dashboard</h1>

              <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">

                    <div>
                      <p class="text-blue-100 text-sm font-medium mb-1">Surat Masuk</p>

                    <div class="bg-white bg-opacity-20 p-4 rounded-full">

                </div>
                
                <div class="card-hover rounded-xl shadow-lg p-6 gradient-green text-white">
                  <div class="flex items-center justify-between">
                    <div>
                      <p class="text-green-100 text-sm font-medium mb-1">Surat Keluar</p>
                      <h3 class="text-4xl font-bold">${suratKeluar.length}</h3>
                    </div>
                    <div class="bg-white bg-opacity-20 p-4 rounded-full">
                      <i class="fas fa-paper-plane text-3xl"></i>
                    </div>
                  </div>
                </div>
                
                <div class="card-hover rounded-xl shadow-lg p-6 gradient-orange text-white">
                  <div class="flex items-center justify-between">
                    <div>
                      <p class="text-orange-100 text-sm font-medium mb-1">Total Surat</p>
                      <h3 class="text-4xl font-bold">${totalSurat}</h3>
                    </div>
                    <div class="bg-white bg-opacity-20 p-4 rounded-full">

              <div class="bg-white rounded-xl shadow-lg p-6 slide-up">
                <div class="flex items-center justify-between mb-6">
                  <h2 class="text-xl font-bold" style="color: ${config.text_color || defaultConfig.text_color};">
                    <i class="fas fa-chart-bar mr-2" style="color: ${config.primary_color || defaultConfig.primary_color};"></i>Statistik Surat
                  </h2>
                  <div class="flex items-center gap-3">
                    <label class="text-sm font-medium text-gray-700">Periode:</label>
                    <select id="chartPeriod" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                      <option value="monthly" ${chartPeriod === 'monthly' ? 'selected' : ''}>Bulanan</option>

      document.getElementById('chartPeriod').addEventListener('change', (e) => {

    }
    
    function setupColorPickers() {
      const colorInputs = [
        { picker: 'primaryColor', text: 'primaryColorText', preview: 'previewPrimary', key: 'primary_color' },
        { picker: 'secondaryColor', text: 'secondaryColorText', preview: 'previewSecondary', key: 'secondary_color' },
        { picker: 'accentColor', text: 'accentColorText', preview: 'previewAccent', key: 'accent_color' },
        { picker: 'textColor', text: 'textColorText', preview: 'previewText', key: 'text_color' },
        { picker: 'backgroundColor', text: 'backgroundColorText', preview: 'previewBackground', key: 'background_color' },
        { picker: 'navbarColor', text: 'navbarColorText', preview: 'previewNavbar', key: 'navbar_color' },
        { picker: 'tabColor', text: 'tabColorText', preview: 'previewTab', key: 'tab_color' }
      ];
      
      colorInputs.forEach(input => {
        const pickerEl = document.getElementById(input.picker);
        const textEl = document.getElementById(input.text);
        const previewEl = document.getElementById(input.preview);
        
        if (pickerEl && textEl && previewEl) {
          pickerEl.addEventListener('input', (e) => {
            const color = e.target.value;
            textEl.value = color;
            if (input.key === 'text_color') {
              previewEl.querySelector('span').style.color = color;
            } else if (input.key === 'background_color' || input.key === 'navbar_color' || input.key === 'tab_color') {
              previewEl.style.background = color;
            } else {
              previewEl.style.background = color;
            }
          });
          
          textEl.addEventListener('input', (e) => {
            const color = e.target.value;
            if (/^#[0-9A-F]{6}$/i.test(color)) {
              pickerEl.value = color;
              if (input.key === 'text_color') {
                previewEl.querySelector('span').style.color = color;
              } else if (input.key === 'background_color' || input.key === 'navbar_color' || input.key === 'tab_color') {
                previewEl.style.background = color;
              } else {
                previewEl.style.background = color;
              }
            }
          });
        }
      });
    }
    
    async function saveColorSettings() {
      if (!window.elementSdk) {
        showToast('Tidak dapat menyimpan pengaturan warna', 'error');
        return;
      }
      
      const newColors = {
        primary_color: document.getElementById('primaryColor').value,
        secondary_color: document.getElementById('secondaryColor').value,
        accent_color: document.getElementById('accentColor').value,
        text_color: document.getElementById('textColor').value,
        background_color: document.getElementById('backgroundColor').value,
        navbar_color: document.getElementById('navbarColor').value,
        tab_color: document.getElementById('tabColor').value
      };
      
      await window.elementSdk.setConfig(newColors);
      showToast('Pengaturan warna berhasil disimpan!', 'success');
    }
    
    function resetColorSettings() {
      if (!window.elementSdk) {
        showToast('Tidak dapat mereset pengaturan warna', 'error');
        return;
      }
      
      const resetColors = {
        primary_color: defaultConfig.primary_color,
        secondary_color: defaultConfig.secondary_color,
        accent_color: defaultConfig.accent_color,
        text_color: defaultConfig.text_color,
        background_color: defaultConfig.background_color,
        navbar_color: defaultConfig.navbar_color,
        tab_color: defaultConfig.tab_color
      };
      
      window.elementSdk.setConfig(resetColors);
      showToast('Pengaturan warna berhasil direset!', 'success');
    }

    function renderChart() {
      const config = getConfig();
      let chartData = {};
      
      if (chartPeriod === 'monthly') {
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Oct', 'Nov', 'Des'];
        const currentYear = new Date().getFullYear();
        
        months.forEach(month => {
          chartData[month] = { masuk: 0, keluar: 0 };
        });
        
        allRecords.forEach(record => {
          const date = new Date(record.tanggal_terima || record.created_at);
          if (date.getFullYear() === currentYear) {
            const month = months[date.getMonth()];
            if (record.type === 'masuk') {
              chartData[month].masuk++;
            } else {
              chartData[month].keluar++;
            }
          }
        });
      } else if (chartPeriod === 'yearly') {
        const years = [...new Set(allRecords.map(r => {
          const date = new Date(r.tanggal_terima || r.created_at);
          return date.getFullYear();
        }))].sort();
        
        if (years.length === 0) {
          years.push(new Date().getFullYear());
        }
        
        years.forEach(year => {
          chartData[year] = { masuk: 0, keluar: 0 };
        });
        
        allRecords.forEach(record => {
          const date = new Date(record.tanggal_terima || record.created_at);
          const year = date.getFullYear();
          if (chartData[year]) {
            if (record.type === 'masuk') {
              chartData[year].masuk++;
            } else {
              chartData[year].keluar++;
            }
          }
        });
      }

    function handleProfileUpdate(e) {
      e.preventDefault();
      const fileInput = document.getElementById('profileImage');
      
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const reader = new FileReader();
        
        reader.onload = function(event) {
          currentUser.profileImage = event.target.result;
          renderProfil();
        };
        
        reader.readAsDataURL(file);
      }
    }

    function handlePasswordChange(e) {
      e.preventDefault();
      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const messageDiv = document.getElementById('passwordMessage');
      
      if (currentPassword !== currentUser.password) {
        messageDiv.textContent = 'Kata sandi saat ini salah!';
        messageDiv.className = 'text-sm p-3 rounded-lg bg-red-50 text-red-600';
        messageDiv.classList.remove('hidden');
        return;
      }
      
      if (newPassword !== confirmPassword) {
        messageDiv.textContent = 'Kata sandi baru dan konfirmasi tidak cocok!';
        messageDiv.className = 'text-sm p-3 rounded-lg bg-red-50 text-red-600';
        messageDiv.classList.remove('hidden');
        return;
      }
      
      if (newPassword.length < 6) {
        messageDiv.textContent = 'Kata sandi baru minimal 6 karakter!';
        messageDiv.className = 'text-sm p-3 rounded-lg bg-red-50 text-red-600';
        messageDiv.classList.remove('hidden');
        return;
      }
      
      currentUser.password = newPassword;
      messageDiv.textContent = 'Kata sandi berhasil diubah!';
      messageDiv.className = 'text-sm p-3 rounded-lg bg-green-50 text-green-600';
      messageDiv.classList.remove('hidden');
      
      document.getElementById('passwordForm').reset();
    }

    async function handleSuratSubmit(e, type) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Menyimpan...';
      
      const fileInput = document.getElementById('fileSurat');
      let fileName = null;
      let fileType = null;
      let fileUrl = null;
      
      // Upload file jika ada
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        showToast('Mengupload file...', 'info');
        
        const uploadResult = await uploadFile(file);
        
        if (uploadResult.success) {
          fileName = uploadResult.data.fileName;
          fileType = file.name.endsWith('.pdf') ? 'pdf' : 'word';
          fileUrl = uploadResult.data.fileUrl;
          showToast('File berhasil diupload!', 'success');
        } else {
          const messageDiv = document.getElementById('formMessage');
          messageDiv.textContent = 'Gagal upload file: ' + uploadResult.message;
          messageDiv.className = 'text-sm p-3 rounded-lg bg-red-50 text-red-600';
          messageDiv.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fas fa-save mr-2"></i>Simpan';
          return;
        }
      }
      
      const suratData = {
        id: editingId || 'surat_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
        type: type,
        nomor_urut: parseInt(document.getElementById('nomorUrut').value),
        tanggal_terima: document.getElementById('tanggalTerima').value,
        nomor_surat: document.getElementById('nomorSurat').value,
        tanggal_surat: document.getElementById('tanggalSurat').value,
        sifat: document.getElementById('sifatSurat').value,
        isi_ringkas: document.getElementById('isiRingkas').value,
        dari: document.getElementById('dari').value,
        kepada: document.getElementById('kepada').value,
        pengelola: type === 'masuk' ? document.getElementById('pengelola').value : '',
        keterangan: type === 'keluar' ? (document.getElementById('keterangan') ? document.getElementById('keterangan').value : '') : '',
        file_name: fileName,
        file_type: fileType,
        file_url: fileUrl,
        created_at: new Date().toISOString()
      };
      
      let result;
      if (editingId) {
        result = await updateSurat(suratData);
      } else {
        result = await createSurat(suratData);
      }
      
      if (result.success) {
        showToast('Data berhasil disimpan!', 'success');
        await loadData();
        navigateTo(`surat-${type}`);
      } else {
        const messageDiv = document.getElementById('formMessage');
        messageDiv.textContent = 'Gagal menyimpan data: ' + result.message;
        messageDiv.className = 'text-sm p-3 rounded-lg bg-red-50 text-red-600';
        messageDiv.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-save mr-2"></i>Simpan';
      }
    }

    function showDeleteConfirm(id, type) {
      const config = getConfig();
      const surat = allRecords.find(r => r.id === id);
      if (!surat) return;
      
      const overlay = document.createElement('div');
      overlay.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 fade-in';
      overlay.innerHTML = `
        <div class="bg-white rounded-xl shadow-2xl p-6 max-w-md w-full mx-4 scale-in">
          <div class="text-center mb-6">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <i class="fas fa-exclamation-triangle text-red-600 text-3xl"></i>
            </div>
            <h3 class="text-xl font-bold mb-2" style="color: ${config.text_color || defaultConfig.text_color};">Konfirmasi Hapus</h3>
            <p class="text-gray-600">Apakah Anda yakin ingin menghapus surat ini?</p>
            <p class="text-sm text-gray-500 mt-2">No: ${surat.nomor_surat}</p>
          </div>
          
          <div class="flex gap-4">
            <button onclick="confirmDelete('${id}', '${type}')" class="flex-1 py-3 bg-red-500 text-white rounded-lg font-semibold btn-hover shadow-lg">
              <i class="fas fa-trash mr-2"></i>Ya, Hapus
            </button>
            <button onclick="closeDeleteConfirm()" class="flex-1 py-3 bg-gray-300 text-gray-700 rounded-lg font-semibold btn-hover shadow-lg">
              <i class="fas fa-times mr-2"></i>Batal
            </button>
          </div>
        </div>
      `;
      
      document.body.appendChild(overlay);
    }

    async function confirmDelete(id, type) {
      const overlay = document.querySelector('.fixed.inset-0');
      const deleteBtn = overlay.querySelector('button[onclick^="confirmDelete"]');
      deleteBtn.disabled = true;
      deleteBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Menghapus...';
      
      const result = await deleteSurat(id, type);
      
      if (result.success) {
        showToast('Data berhasil dihapus!', 'success');
        await loadData();
        closeDeleteConfirm();
        renderCurrentView();
      } else {
        showToast('Gagal menghapus data: ' + result.message, 'error');
        deleteBtn.disabled = false;
        deleteBtn.innerHTML = '<i class="fas fa-trash mr-2"></i>Ya, Hapus';
      }
    }

    function closeDeleteConfirm() {
      const overlay = document.querySelector('.fixed.inset-0');
      if (overlay) {
        overlay.remove();
      }
    }

    function renderSifatBadge(sifat) {
      const badges = {
        'Biasa': 'bg-gray-100 text-gray-800',
        'Penting': 'bg-yellow-100 text-yellow-800',
        'Segera': 'bg-orange-100 text-orange-800',
        'Rahasia': 'bg-red-100 text-red-800'
      };
      
      const badgeClass = badges[sifat] || badges['Biasa'];
      return `<span class="px-3 py-1 rounded-full text-xs font-semibold ${badgeClass}">${sifat}</span>`;
    }

    function formatDate(dateString) {
      if (!dateString) return '-';
      const date = new Date(dateString);
      return date.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function navigateTo(view) {
      currentView = view;
      renderCurrentView();
    }

    function renderCurrentView() {
      switch(currentView) {
        case 'dashboard':
          renderDashboard();
          break;
        case 'surat-masuk':
          renderSuratMasuk();
          break;
        case 'surat-keluar':
          renderSuratKeluar();
          break;
        case 'profil':
          renderProfil();
          break;
      }
    }

    function logout() {
